<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metallic Falcon Quiz</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: #1f2937;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      color: #d1d5db;
      font-size: 32px;
    }

    h2 {
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      background: #4b5563;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #6b7280;
      transform: scale(1.02);
    }

    .correct {
      background: #15803d !important;
    }

    .wrong {
      background: #b91c1c !important;
    }

    #nextBtn, #restartBtn {
      background: #2563eb;
      display: none;
    }

    #score {
      font-size: 22px;
      margin: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HOME PAGE -->
  <div id="home">
    <h1>🦅 Metallic Falcon Quiz</h1>
    <p>Let's see who knows the group best!</p>
    <button onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- QUIZ PAGE -->
  <div id="quiz" class="hidden">
    <h2 id="question"></h2>

    <div id="answers"></div>

    <p id="result"></p>

    <button id="nextBtn" onclick="nextQuestion()">Next Question</button>
  </div>

  <!-- RESULT PAGE -->
  <div id="end" class="hidden">
    <h1>Quiz Complete! 🎉</h1>
    <div id="score"></div>
    <button id="restartBtn" onclick="restartQuiz()">Play Again</button>
  </div>

</div>

<script>

const questions = [

  {
    question: "Who is gay in this group?",
    answers: ["Prajit", "Aritra Mondal", "Both", "None of them"],
    correct: 2
  },

  {
    question: "Who is Ludo the Lulli King?",
    answers: ["Mondal", "Prajit", "Abhranil", "Mukherjee"],
    correct: 0
  },

  {
    question: "Who is Topper (straight)?",
    answers: ["Soumyadip", "Abhranil", "Prajit", "Mondal"],
    correct: 0
  },

  {
    question: "Who travels most?",
    answers: ["Anish", "Soumyadip", "Mukherjee", "Prajit"],
    correct: 0
  },

  {
    question: "Who is Deb Dar Chorom Vokto?",
    answers: ["Mondal", "Soumyadip", "Mukherjee", "Abhranil"],
    correct: 1
  },

  {
    question: "Who knows business?",
    answers: ["Abhranil", "Prajit", "Mondal", "Anish"],
    correct: 0
  },

  {
    question: "Who is BJP Choda?",
    answers: ["Mondal", "Mukherjee", "Soumyadip", "Anish"],
    correct: 0
  },

  {
    question: "Who is gay topper?",
    answers: ["Mukherjee", "Prajit", "Abhranil", "Mondal"],
    correct: 1
  },

  {
    question: "Girls are diwana of whom?",
    answers: ["Anish", "Mukherjee", "Prajit", "Mondal"],
    correct: 1
  },

  {
    question: "Who is most santo in this group?",
    answers: ["Abhranil", "Anish", "Prajit", "Mondal"],
    correct: 1
  }

];

let currentQuestion = 0;
let score = 0;


// START QUIZ
function startQuiz() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();
}


// SHOW QUESTION
function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("question").textContent =
    (currentQuestion + 1) + ". " + q.question;

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  document.getElementById("result").textContent = "";

  document.getElementById("nextBtn").style.display = "none";

  q.answers.forEach((answer, index) => {

    const button = document.createElement("button");

    button.textContent =
      String.fromCharCode(65 + index) + ") " + answer;

    button.onclick = () => checkAnswer(index, button);

    answersDiv.appendChild(button);

  });
}


// CHECK ANSWER
function checkAnswer(selected, selectedButton) {

  const correct = questions[currentQuestion].correct;

  const buttons = document.querySelectorAll("#answers button");

  // Prevent clicking multiple answers
  buttons.forEach(button => {
    button.disabled = true;
  });

  if (selected === correct) {

    selectedButton.classList.add("correct");

    document.getElementById("result").textContent =
      "✅ Correct!";

    score++;

  } else {

    selectedButton.classList.add("wrong");

    buttons[correct].classList.add("correct");

    document.getElementById("result").textContent =
      "❌ Wrong!";

  }

  document.getElementById("nextBtn").style.display = "block";
}


// NEXT QUESTION
function nextQuestion() {

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResult();
  }
}


// SHOW FINAL RESULT
function showResult() {

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("end").classList.remove("hidden");

  document.getElementById("score").textContent =
    "Your score: " + score + " / " + questions.length;

  document.getElementById("restartBtn").style.display = "block";
}


// RESTART
function restartQuiz() {

  currentQuestion = 0;
  score = 0;

  document.getElementById("end").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();
}

</script>

</body>
</html>
